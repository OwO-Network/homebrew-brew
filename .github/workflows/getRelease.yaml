
name: update release version

on: 
  #schedule:
  #- cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Shell
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash getRelease.sh
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: update release version
      # Commit first so one broken upstream does not throw away the formulae
      # that did update, then make the failure visible.
      - name: Report failed updates
        if: steps.update.outputs.failed != ''
        run: |
          echo "::error::Could not update: ${{ steps.update.outputs.failed }}"
          exit 1
